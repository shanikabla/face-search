# Common config shared by every Airflow service (YAML anchor, reused below with <<: *airflow-common)
x-airflow-common: &airflow-common
  # Built once by airflow-init (see below); the other services reuse it.
  # Building it from 4 services in parallel races on the same image tag.
  image: face-search-airflow:latest
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Airflow 3: tasks report their state to the API server over HTTP
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Shared secrets so all components trust each other's tokens
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set it in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set it in .env}
    # Local dev: no login screen in the UI
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Our own application database (separate from Airflow's metadata DB)
    FACES_DB_URL: postgresql://${FACES_DB_USER}:${FACES_DB_PASSWORD}@postgres:5432/${FACES_DB_NAME}
    # Our code: importable as "face_search" from DAGs and scripts
    PYTHONPATH: /opt/airflow
    # Where DeepFace caches downloaded model weights
    DEEPFACE_HOME: /opt/airflow/deepface_home
  volumes:
    - ./dags:/opt/airflow/dags
    - ./face_search:/opt/airflow/face_search
    - ./data:/opt/airflow/data
    - deepface_weights:/opt/airflow/deepface_home
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      # Read by db/init.sh to create the application DB
      FACES_DB_USER: ${FACES_DB_USER:?set it in .env}
      FACES_DB_PASSWORD: ${FACES_DB_PASSWORD:?set it in .env}
      FACES_DB_NAME: ${FACES_DB_NAME:?set it in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first start (empty volume): creates the "faces" DB + pgvector
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # One-shot job: creates/upgrades Airflow's metadata tables, then exits
  airflow-init:
    <<: *airflow-common
    build: .
    command: db migrate

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3: parsing DAG files is a separate process from scheduling
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  deepface_weights:
